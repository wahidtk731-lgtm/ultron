<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ultron Gemini Assistant</title>
  <style>
    :root {
      --gemini-bg: #1E1F22;
      --gemini-border: #303238;
      --gemini-pill-btn: #282A2E;
      --gemini-hover: #353840;
      --gemini-blue: #1A73E8;
      --gemini-blue-active: #4285F4;
      --gemini-red: #EA4335;
      --gemini-amber: #FBBC05;
      --gemini-green: #34A853;
      --gemini-cyan: #00E5FF;
      --gemini-purple: #9B51E0;
      --gemini-pink: #EC4899;
      --text-white: #FFFFFF;
      --text-muted: #9AA0A6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    body {
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: max(24px, env(safe-area-inset-bottom, 24px));
      overflow: hidden;
    }

    /* Floating Overlay Mode over other apps (YouTube, Chrome, Games) */
    body.overlay-mode {
      height: 100% !important;
      min-height: unset !important;
      padding: 4px 0 !important;
      margin: 0 !important;
      box-sizing: border-box !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      overflow: visible !important;
    }

    body.overlay-mode .backdrop {
      display: none !important;
    }

    /* Never crowd floating mode with the assistant prompt banner */
    body.overlay-mode .assistant-prompt-banner {
      display: none !important;
    }

    body.overlay-mode .assistant-container {
      width: 96% !important;
      max-width: 480px !important;
      margin: 0 !important;
      gap: 6px !important;
      animation: none !important;
      transform: none !important;
      box-sizing: border-box !important;
    }

    body.overlay-mode .stadium-capsule {
      margin: 0 !important;
    }

    body.overlay-mode .status-text {
      margin-top: 2px !important;
      font-size: 11px !important;
    }

    /* Collapsible Mini Floating Bubble Mode (Never covers other apps) */
    .mini-bubble {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #1e1f22;
      border: 2px solid #4285f4;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7);
      cursor: pointer;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      animation: pulseGlow 2.5s infinite ease-in-out;
    }
    .mini-bubble-inner {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a73e8, #9b51e0);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mini-bubble-mic {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(66, 133, 244, 0.4); }
      50% { box-shadow: 0 0 20px rgba(155, 81, 224, 0.8); }
    }
    body.mini-bubble-active {
      background: transparent !important;
      overflow: hidden !important;
      padding: 0 !important;
      margin: 0 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      height: 100% !important;
    }

    /* Backdrop dim */
    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
      opacity: 0;
      animation: fadeInBackdrop 0.25s cubic-bezier(0, 0, 0.2, 1) forwards;
    }

    @keyframes fadeInBackdrop {
      to { opacity: 1; }
    }

    /* Assistant Container */
    .assistant-container {
      position: relative;
      z-index: 10;
      width: 94%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      animation: slideUpCapsule 0.3s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    @keyframes slideUpCapsule {
      from { transform: translateY(80px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Response / Transcription Bubble */
    .response-card {
      background: rgba(30, 31, 34, 0.95);
      border: 1px solid var(--gemini-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 14px 18px;
      width: 100%;
      color: var(--text-white);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: none;
      animation: slideUp 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .response-card.active {
      display: block;
    }

    .query-text {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-style: italic;
    }

    .reply-text {
      font-size: 16px;
      line-height: 1.4;
      color: var(--text-white);
      font-weight: 400;
    }

    /* Suggestion Chips */
    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      width: 100%;
      padding: 2px 4px;
      scrollbar-width: none;
    }
    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: var(--gemini-pill-btn);
      border: 1px solid var(--gemini-border);
      color: var(--text-muted);
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip:active {
      background: var(--gemini-hover);
      color: var(--text-white);
      border-color: var(--gemini-blue-active);
    }

    /* Stadium Pill Container (Matches 54px Gemini Capsule) */
    .stadium-capsule {
      position: relative;
      width: 100%;
      height: 56px;
      background: var(--gemini-bg);
      border: 1px solid var(--gemini-border);
      border-radius: 28px;
      display: flex;
      align-items: center;
      padding: 4px 6px 4px 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
    }

    /* Dynamic Gemini Shimmer Loading Wave */
    .shimmer-wave {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, 
        var(--gemini-blue), 
        var(--gemini-purple), 
        var(--gemini-pink), 
        var(--gemini-amber), 
        var(--gemini-cyan), 
        var(--gemini-green)
      );
      background-size: 300% 100%;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .stadium-capsule.processing .shimmer-wave {
      opacity: 1;
      animation: shimmerAnim 1.8s linear infinite;
    }

    @keyframes shimmerAnim {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* Glowing Microphone Button */
    .mic-button {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--gemini-pill-btn);
      border: 1px solid var(--gemini-border);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mic-button svg {
      width: 20px;
      height: 20px;
      fill: var(--text-white);
      transition: all 0.25s ease;
    }

    /* Glow States */
    .mic-button.ready {
      border-color: var(--gemini-cyan);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
    }
    .mic-button.ready svg {
      fill: var(--gemini-cyan);
    }

    .mic-button.listening {
      background: #3b1b1f;
      border-color: var(--gemini-red);
      box-shadow: 0 0 20px rgba(234, 67, 53, 0.65);
      animation: pulseGlow 1.2s infinite alternate;
    }
    .mic-button.listening svg {
      fill: var(--gemini-red);
    }

    .mic-button.processing {
      border-color: var(--gemini-amber);
      box-shadow: 0 0 16px rgba(251, 188, 5, 0.5);
    }
    .mic-button.processing svg {
      fill: var(--gemini-amber);
    }

    .mic-button.speaking {
      border-color: var(--gemini-green);
      box-shadow: 0 0 16px rgba(52, 168, 83, 0.5);
    }
    .mic-button.speaking svg {
      fill: var(--gemini-green);
    }

    @keyframes pulseGlow {
      from { transform: scale(0.96); box-shadow: 0 0 10px rgba(234, 67, 53, 0.4); }
      to { transform: scale(1.06); box-shadow: 0 0 24px rgba(234, 67, 53, 0.85); }
    }

    /* Text Input Area */
    .input-wrapper {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      margin: 0 10px;
    }

    .text-input {
      width: 100%;
      height: 38px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-white);
      font-size: 15px;
      font-weight: 400;
    }

    .text-input::placeholder {
      color: #8E9196;
    }

    /* Send / Action Button */
    .action-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: transparent;
      border: none;
      outline: none;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .action-btn:active {
      color: var(--text-white);
    }

    .action-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Status Label */
    .status-text {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
      text-align: center;
      margin-top: 2px;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Default Assistant Prompt Banner */
    .assistant-prompt-banner {
      width: 100%;
      background: rgba(26, 115, 232, 0.25);
      border: 1px solid var(--gemini-blue);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 12px 14px;
      color: var(--text-white);
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: relative;
    }
    .prompt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .prompt-title {
      font-weight: 600;
      color: var(--text-white);
      font-size: 13px;
    }
    .btn-close-banner {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: var(--text-muted);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all 0.2s ease;
    }
    .btn-close-banner:active {
      color: var(--text-white);
      background: rgba(255, 255, 255, 0.25);
    }
    .prompt-text {
      line-height: 1.4;
      font-size: 12px;
      color: #D2E3FC;
    }
    .prompt-actions {
      display: flex;
      gap: 10px;
    }
    .btn-prompt-primary {
      background: var(--gemini-blue);
      border: none;
      color: white;
      padding: 7px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-prompt-secondary {
      background: var(--gemini-pill-btn);
      border: 1px solid var(--gemini-border);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn-test-voice {
      background: rgba(26, 115, 232, 0.2);
      border: 1px solid var(--gemini-blue);
      color: var(--gemini-blue);
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-test-voice:active {
      background: var(--gemini-blue);
      color: white;
    }
    .chip-primary {
      border-color: var(--gemini-blue) !important;
      color: var(--text-white) !important;
      background: rgba(26, 115, 232, 0.25) !important;
      font-weight: 500;
    }

    /* Settings Modal */
    .settings-modal {
      width: 100%;
      max-height: 60vh;
      overflow-y: auto;
      background: var(--gemini-bg);
      border: 1px solid var(--gemini-border);
      backdrop-filter: blur(25px);
      border-radius: 20px;
      padding: 16px;
      color: var(--text-white);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: slideUp 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px solid var(--gemini-border);
      padding-bottom: 8px;
    }
    .btn-close-settings {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
    }
    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .setting-item label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .theme-options, .voice-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .theme-btn, .voice-btn {
      background: var(--gemini-pill-btn);
      border: 1px solid var(--gemini-border);
      color: var(--text-white);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .theme-btn.active, .voice-btn.active {
      border-color: var(--gemini-blue-active);
      background: rgba(26, 115, 232, 0.35);
      color: var(--text-white);
    }
    .shortcut-buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .btn-setting-action {
      background: var(--gemini-pill-btn);
      border: 1px solid var(--gemini-border);
      color: var(--text-white);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="backdrop" id="backdrop" onclick="onBackdropClick()"></div>

  <!-- Floating Mini Bubble View (52x52 Clickable Orb - Never covers screen) -->
  <div class="mini-bubble" id="miniBubble" onclick="expandFromBubble()" title="Tap to Open Ultron">
    <div class="mini-bubble-inner">
      <svg viewBox="0 0 24 24" class="mini-bubble-mic">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </div>
  </div>

  <div class="assistant-container">
    
    <!-- Quick Suggestion Chips (Clean, Prioritized) -->
    <div class="chips-row">
      <div class="chip chip-primary" onclick="openSettingsModal()">⚙️ Settings</div>
      <div class="chip chip-recent" id="chipRecentApp" onclick="openRecentApp()">🕒 Recent App</div>
      <div class="chip" onclick="quickCommand('Close app')">⏹️ Close App</div>
      <div class="chip" onclick="quickCommand('Turn on Wi-Fi')">📶 Wi-Fi</div>
      <div class="chip" onclick="quickCommand('Turn on Bluetooth')">ᛒ Bluetooth</div>
      <div class="chip" onclick="quickCommand('Clear notifications')">🔔 Clear Notifications</div>
      <div class="chip" id="chipDockPos" onclick="toggleDockPosition()" style="display: none;">📌 Move HUD</div>
      <div class="chip" id="chipMinimize" onclick="minimizeToBubble()" style="display: none;">🫧 Collapse Bubble</div>
      <div class="chip" onclick="dismissAssistant()">Hide</div>
    </div>

    <!-- First Launch Default Assistant Banner -->
    <div class="assistant-prompt-banner" id="assistantPromptBanner" style="display: none;">
      <div class="prompt-header">
        <span class="prompt-title">⚡ Set Ultron as Default Assistant</span>
        <button class="btn-close-banner" onclick="dismissPrompt()" title="Dismiss">✕</button>
      </div>
      <div class="prompt-text">
        Open Ultron whenever you press and hold the center Home button.
      </div>
      <div class="prompt-actions">
        <button class="btn-prompt-primary" onclick="setAsDefaultAssistant()">Set Default Assistant</button>
        <button class="btn-prompt-secondary" onclick="dismissPrompt()">Got It / Later</button>
      </div>
    </div>

    <!-- Ultron Settings Modal -->
    <div class="settings-modal" id="settingsModal" style="display: none;">
      <div class="settings-header">
        <span>Ultron Settings</span>
        <button class="btn-close-settings" onclick="closeSettingsModal()">✕</button>
      </div>
      <div class="settings-body">
        <!-- Theme selection -->
        <div class="setting-item">
          <label>Theme Style</label>
          <div class="theme-options">
            <button class="theme-btn active" id="themeDefault" onclick="setTheme('default')">Dark Slate</button>
            <button class="theme-btn" id="themeCyberpunk" onclick="setTheme('cyberpunk')">Cyberpunk</button>
            <button class="theme-btn" id="themeOled" onclick="setTheme('oled')">OLED Black</button>
            <button class="theme-btn" id="themeTitanium" onclick="setTheme('titanium')">Titanium</button>
          </div>
        </div>

        <!-- Voice Sound & Pitch -->
        <div class="setting-item">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label>Voice Pitch</label>
            <button class="btn-test-voice" onclick="testVoiceSound()">🔊 Test Voice</button>
          </div>
          <div class="voice-options">
            <button class="voice-btn" id="pitchDeep" onclick="setVoicePitch(0.8)">Deep</button>
            <button class="voice-btn active" id="pitchNatural" onclick="setVoicePitch(0.95)">Natural</button>
            <button class="voice-btn" id="pitchHigher" onclick="setVoicePitch(1.2)">Higher</button>
          </div>
        </div>

        <!-- Speech Speed -->
        <div class="setting-item">
          <label>Speech Pacing</label>
          <div class="voice-options">
            <button class="voice-btn" id="speedSlow" onclick="setVoiceSpeed(0.85)">Slow</button>
            <button class="voice-btn active" id="speedNormal" onclick="setVoiceSpeed(1.05)">Normal</button>
            <button class="voice-btn" id="speedFast" onclick="setVoiceSpeed(1.25)">Fast</button>
          </div>
        </div>

        <!-- System Shortcuts -->
        <div class="setting-item">
          <label>System Integration</label>
          <div class="shortcut-buttons">
            <button class="btn-setting-action" onclick="setAsDefaultAssistant()">⚙️ Change Default Assistant (Center Button)</button>
            <button class="btn-setting-action" onclick="refreshAppsIndex()">🔄 Re-train Installed Apps</button>
            <button class="btn-setting-action" id="btnDockToggle" onclick="toggleDockPosition()" style="display: none;">📌 Move HUD to Top / Bottom</button>
            <button class="btn-setting-action" id="btnOverlayClose" onclick="closeOverlayAction()" style="display: none;">❌ Close Floating Overlay</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Response / Feedback Card -->
    <div class="response-card" id="responseCard">
      <div class="query-text" id="queryText"></div>
      <div class="reply-text" id="replyText"></div>
    </div>

    <!-- 54px Gemini Capsule Stadium Pill -->
    <div class="stadium-capsule" id="stadiumCapsule">
      <!-- Microphone Button -->
      <button class="mic-button ready" id="micBtn" onclick="toggleListening()">
        <svg viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>

      <!-- Text Entry -->
      <div class="input-wrapper">
        <input 
          type="text" 
          class="text-input" 
          id="cmdInput" 
          placeholder="Ask Ultron..." 
          autocomplete="off" 
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          onkeydown="onInputKey(event)"
        />
      </div>

      <!-- Minimize to Floating Bubble Button -->
      <button class="action-btn" id="btnMinimizeCapsule" onclick="minimizeToBubble()" title="Collapse to Bubble" style="display: none;">
        <svg viewBox="0 0 24 24">
          <path d="M19 13H5v-2h14v2z"/>
        </svg>
      </button>

      <!-- Settings Button -->
      <button class="action-btn" id="settingsBtn" onclick="openSettingsModal()" title="Ultron Settings">
        <svg viewBox="0 0 24 24">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>

      <!-- Send Button -->
      <button class="action-btn" id="sendBtn" onclick="submitTextInput()">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>

      <!-- Gradient Shimmer Wave -->
      <div class="shimmer-wave"></div>
    </div>

    <div class="status-text" id="statusLabel">Ultron AI Assistant • 100% Offline</div>
  </div>

  <script>
    let currentState = "ready"; // ready, listening, processing, speaking
    let webSpeechRec = null;
    let webSpeechSynth = window.speechSynthesis;

    // Check if running inside Android WebView with Native Java Bridge
    const hasAndroidBridge = typeof window.AndroidUltron !== "undefined";

    // Set UI State
    function setState(state, message) {
      currentState = state;
      const micBtn = document.getElementById("micBtn");
      const capsule = document.getElementById("stadiumCapsule");
      const statusLabel = document.getElementById("statusLabel");
      const input = document.getElementById("cmdInput");

      micBtn.className = "mic-button " + state;
      capsule.className = "stadium-capsule " + (state === "processing" ? "processing" : "");

      if (message) {
        statusLabel.innerText = message;
      } else {
        if (state === "ready") statusLabel.innerText = "Ultron AI Assistant • Ready";
        if (state === "listening") statusLabel.innerText = "Listening for command...";
        if (state === "processing") statusLabel.innerText = "Thinking...";
        if (state === "speaking") statusLabel.innerText = "Speaking...";
      }

      // Input lockout while speaking
      input.disabled = (state === "speaking");
    }

    // Toggle Listening
    function toggleListening() {
      if (currentState === "listening") {
        stopListening();
      } else {
        startListening();
      }
    }

    function startListening() {
      setState("listening", "Listening...");

      if (hasAndroidBridge) {
        window.AndroidUltron.startListening();
      } else {
        // Fallback to Web Speech API
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec) {
          try {
            webSpeechRec = new SpeechRec();
            webSpeechRec.lang = "en-US";
            webSpeechRec.interimResults = false;
            webSpeechRec.maxAlternatives = 1;

            webSpeechRec.onresult = (event) => {
              const transcript = event.results[0][0].transcript;
              processCommand(transcript);
            };

            webSpeechRec.onerror = (e) => {
              setState("ready", "Error listening: " + e.error);
            };

            webSpeechRec.onend = () => {
              if (currentState === "listening") setState("ready");
            };

            webSpeechRec.start();
          } catch (e) {
            setState("ready", "Microphone unavailable");
          }
        } else {
          setState("ready", "Speech recognition not supported in this browser");
        }
      }
    }

    function stopListening() {
      if (hasAndroidBridge) {
        window.AndroidUltron.stopListening();
      } else if (webSpeechRec) {
        webSpeechRec.stop();
      }
      setState("ready");
    }

    // Submit Text Input
    function submitTextInput() {
      const input = document.getElementById("cmdInput");
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      processCommand(text);
    }

    function onInputKey(event) {
      if (event.key === "Enter") {
        submitTextInput();
      }
    }

    function quickCommand(cmd) {
      processCommand(cmd);
    }

    function toggleFloating() {
      if (hasAndroidBridge && window.AndroidUltron.toggleFloatingOverlay) {
        window.AndroidUltron.toggleFloatingOverlay();
      }
    }

    function processCommand(text) {
      setState("processing", "Processing command...");

      showCard(text, "Thinking...");

      if (hasAndroidBridge) {
        window.AndroidUltron.processCommand(text);
      } else {
        // Local client-side evaluation for PWA/Browser demo
        setTimeout(() => {
          const reply = localEvaluate(text);
          showCard(text, reply);
          speakResponse(reply);
        }, 350);
      }
    }

    function showCard(query, reply) {
      const card = document.getElementById("responseCard");
      document.getElementById("queryText").innerText = `"${query}"`;
      document.getElementById("replyText").innerText = reply;
      card.classList.add("active");
    }

    function speakResponse(text) {
      setState("speaking", "Speaking response...");
      if (webSpeechSynth) {
        webSpeechSynth.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        utter.pitch = 0.95;
        utter.onend = () => setState("ready");
        webSpeechSynth.speak(utter);
      } else {
        setTimeout(() => setState("ready"), 1500);
      }
    }

    // Local client-side evaluation fallback (mirrors Python logic)
    function localEvaluate(raw) {
      const lower = raw.toLowerCase().trim();
      if (lower.includes("time")) {
        const now = new Date();
        return `The current time is ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}.`;
      }
      if (lower.includes("who are you") || lower.includes("what can you do") || lower.includes("capabilities")) {
        return "I am Ultron, your offline AI assistant. I can open applications, launch websites, tell time, and search.";
      }
      if (lower.startsWith("open ") || lower.startsWith("launch ")) {
        const target = lower.replace(/^(open|launch)\s+/, "").trim();
        return `Opening ${target}...`;
      }
      if (lower.includes("search ") || lower.includes("google ")) {
        const query = lower.replace(/^(search google for|search for|google|search)\s+/, "").trim();
        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
        return `Searching Google for "${query}".`;
      }
      if (lower.includes("hello") || lower.includes("hi") || lower.includes("hey")) {
        return "Hello! Ultron is online and ready for your commands.";
      }
      return `Processed command: "${raw}".`;
    }

    function onBackdropClick() {
      if (hasAndroidBridge) {
        window.AndroidUltron.dismiss();
      }
    }

    function dismissAssistant() {
      if (hasAndroidBridge) {
        window.AndroidUltron.dismiss();
      }
    }

    function openSettingsModal() {
      const modal = document.getElementById("settingsModal");
      if (!modal) return;
      const willShow = (modal.style.display !== "flex");
      modal.style.display = willShow ? "flex" : "none";
      if (document.getElementById("responseCard")) {
        document.getElementById("responseCard").classList.remove("active");
      }
      if (document.body.classList.contains("overlay-mode")) {
        if (hasAndroidBridge && window.AndroidUltron.setWindowHeight) {
          window.AndroidUltron.setWindowHeight(willShow ? 480 : 140);
        }
      }
    }

    function closeSettingsModal() {
      const modal = document.getElementById("settingsModal");
      if (modal) modal.style.display = "none";
      if (document.body.classList.contains("overlay-mode")) {
        if (hasAndroidBridge && window.AndroidUltron.setWindowHeight) {
          window.AndroidUltron.setWindowHeight(140);
        }
      }
    }

    function setAsDefaultAssistant() {
      localStorage.setItem("assistant_configured", "true");
      localStorage.setItem("dismissed_assistant_prompt", "true");
      const banner = document.getElementById("assistantPromptBanner");
      if (banner) banner.style.display = "none";
      if (hasAndroidBridge && window.AndroidUltron.setDefaultAssistantConfirmed) {
        window.AndroidUltron.setDefaultAssistantConfirmed();
      }
      if (hasAndroidBridge && window.AndroidUltron.openDefaultAssistantSettings) {
        window.AndroidUltron.openDefaultAssistantSettings();
      }
    }

    function dismissPrompt() {
      localStorage.setItem("dismissed_assistant_prompt", "true");
      const banner = document.getElementById("assistantPromptBanner");
      if (banner) banner.style.display = "none";
      if (hasAndroidBridge && window.AndroidUltron.setDefaultAssistantConfirmed) {
        window.AndroidUltron.setDefaultAssistantConfirmed();
      }
    }

    function testVoiceSound() {
      const phrase = "Hello! Ultron voice calibrated. I am online and ready.";
      if (hasAndroidBridge && window.AndroidUltron.testVoice) {
        window.AndroidUltron.testVoice(phrase);
      } else if (hasAndroidBridge && window.AndroidUltron.saveVoiceSettings) {
        window.AndroidUltron.saveVoiceSettings(currentPitch, currentSpeed);
      } else if (window.speechSynthesis) {
        const u = new SpeechSynthesisUtterance(phrase);
        u.pitch = currentPitch;
        u.rate = currentSpeed;
        window.speechSynthesis.speak(u);
      }
    }

    function closeOverlayAction() {
      if (hasAndroidBridge && window.AndroidUltron.closeFloatingOverlay) {
        window.AndroidUltron.closeFloatingOverlay();
      } else if (hasAndroidBridge) {
        window.AndroidUltron.dismiss();
      }
    }

    function setTheme(theme) {
      document.querySelectorAll(".theme-btn").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById("theme" + theme.charAt(0).toUpperCase() + theme.slice(1));
      if (btn) btn.classList.add("active");

      const root = document.documentElement;
      if (theme === "cyberpunk") {
        root.style.setProperty("--gemini-bg", "#0E0B16");
        root.style.setProperty("--gemini-border", "#4717F6");
        root.style.setProperty("--gemini-pill-btn", "#1D1536");
        root.style.setProperty("--gemini-blue-active", "#00E5FF");
      } else if (theme === "oled") {
        root.style.setProperty("--gemini-bg", "#000000");
        root.style.setProperty("--gemini-border", "#222222");
        root.style.setProperty("--gemini-pill-btn", "#111111");
        root.style.setProperty("--gemini-blue-active", "#FFFFFF");
      } else if (theme === "titanium") {
        root.style.setProperty("--gemini-bg", "#111827");
        root.style.setProperty("--gemini-border", "#1F2937");
        root.style.setProperty("--gemini-pill-btn", "#1F2937");
        root.style.setProperty("--gemini-blue-active", "#3B82F6");
      } else {
        root.style.setProperty("--gemini-bg", "#1E1F22");
        root.style.setProperty("--gemini-border", "#303238");
        root.style.setProperty("--gemini-pill-btn", "#282A2E");
        root.style.setProperty("--gemini-blue-active", "#4285F4");
      }
      localStorage.setItem("ultron_theme", theme);
    }

    let currentPitch = 0.95;
    let currentSpeed = 1.05;

    function setVoicePitch(pitch) {
      currentPitch = pitch;
      document.querySelectorAll(".voice-btn").forEach(b => {
        if (b.id && b.id.startsWith("pitch")) b.classList.remove("active");
      });
      if (pitch <= 0.85) {
        const btn = document.getElementById("pitchDeep");
        if (btn) btn.classList.add("active");
      } else if (pitch >= 1.1) {
        const btn = document.getElementById("pitchHigher");
        if (btn) btn.classList.add("active");
      } else {
        const btn = document.getElementById("pitchNatural");
        if (btn) btn.classList.add("active");
      }
      if (hasAndroidBridge && window.AndroidUltron.saveVoiceSettings) {
        window.AndroidUltron.saveVoiceSettings(currentPitch, currentSpeed);
      }
      localStorage.setItem("ultron_pitch", pitch);
    }

    function setVoiceSpeed(speed) {
      currentSpeed = speed;
      document.querySelectorAll(".voice-btn").forEach(b => {
        if (b.id && b.id.startsWith("speed")) b.classList.remove("active");
      });
      if (speed <= 0.9) {
        const btn = document.getElementById("speedSlow");
        if (btn) btn.classList.add("active");
      } else if (speed >= 1.2) {
        const btn = document.getElementById("speedFast");
        if (btn) btn.classList.add("active");
      } else {
        const btn = document.getElementById("speedNormal");
        if (btn) btn.classList.add("active");
      }
      if (hasAndroidBridge && window.AndroidUltron.saveVoiceSettings) {
        window.AndroidUltron.saveVoiceSettings(currentPitch, currentSpeed);
      }
      localStorage.setItem("ultron_speed", speed);
    }

    function toggleDockPosition() {
      if (hasAndroidBridge && window.AndroidUltron.toggleDockPosition) {
        window.AndroidUltron.toggleDockPosition();
      }
    }

    function refreshAppsIndex() {
      if (hasAndroidBridge && window.AndroidUltron.refreshInstalledApps) {
        window.AndroidUltron.refreshInstalledApps();
        alert("Installed apps index refreshed!");
      }
    }

    window.onAssistantCheck = function(isDefault) {
      if (isDefault || 
          localStorage.getItem("dismissed_assistant_prompt") === "true" || 
          localStorage.getItem("assistant_configured") === "true") {
        const banner = document.getElementById("assistantPromptBanner");
        if (banner) banner.style.display = "none";
        return;
      }
      if (!document.body.classList.contains("overlay-mode")) {
        const banner = document.getElementById("assistantPromptBanner");
        if (banner) banner.style.display = "flex";
      }
    };

    // Load saved preferences on init
    window.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem("ultron_theme");
      if (savedTheme) setTheme(savedTheme);

      const savedPitch = parseFloat(localStorage.getItem("ultron_pitch"));
      if (!isNaN(savedPitch)) {
        setVoicePitch(savedPitch);
      } else {
        setVoicePitch(0.95);
      }

      const savedSpeed = parseFloat(localStorage.getItem("ultron_speed"));
      if (!isNaN(savedSpeed)) {
        setVoiceSpeed(savedSpeed);
      } else {
        setVoiceSpeed(1.05);
      }
    });

    function openRecentApp() {
      if (hasAndroidBridge && window.AndroidUltron.openRecentApp) {
        window.AndroidUltron.openRecentApp();
      } else {
        quickCommand("open recent app");
      }
    }

    function updateRecentAppChip() {
      if (hasAndroidBridge && window.AndroidUltron.getRecentAppName) {
        try {
          const recent = window.AndroidUltron.getRecentAppName();
          const chip = document.getElementById("chipRecentApp");
          if (chip && recent && recent !== "Recent App") {
            chip.textContent = "🕒 Recent: " + recent;
          }
        } catch (ignored) {}
      }
    }

    function minimizeToBubble() {
      if (hasAndroidBridge && window.AndroidUltron.minimizeToBubble) {
        window.AndroidUltron.minimizeToBubble();
      } else {
        setMiniBubbleView(true);
      }
    }

    function expandFromBubble() {
      if (hasAndroidBridge && window.AndroidUltron.expandFromBubble) {
        window.AndroidUltron.expandFromBubble();
      } else {
        setMiniBubbleView(false);
      }
    }

    window.setMiniBubbleView = function(isMini) {
      const miniBubble = document.getElementById("miniBubble");
      const container = document.querySelector(".assistant-container");
      if (isMini) {
        if (miniBubble) miniBubble.style.display = "flex";
        if (container) container.style.display = "none";
        document.body.classList.add("mini-bubble-active");
      } else {
        if (miniBubble) miniBubble.style.display = "none";
        if (container) container.style.display = "flex";
        document.body.classList.remove("mini-bubble-active");
        updateRecentAppChip();
      }
    };

    window.setOverlayMode = function(enabled) {
      if (enabled) {
        document.body.classList.add("overlay-mode");
        const overlayCloseBtn = document.getElementById("btnOverlayClose");
        if (overlayCloseBtn) overlayCloseBtn.style.display = "block";
        const dockChip = document.getElementById("chipDockPos");
        if (dockChip) dockChip.style.display = "inline-flex";
        const dockBtn = document.getElementById("btnDockToggle");
        if (dockBtn) dockBtn.style.display = "block";
        const chipMin = document.getElementById("chipMinimize");
        if (chipMin) chipMin.style.display = "inline-flex";
        const btnMin = document.getElementById("btnMinimizeCapsule");
        if (btnMin) btnMin.style.display = "inline-flex";
        updateRecentAppChip();
      } else {
        document.body.classList.remove("overlay-mode");
        const overlayCloseBtn = document.getElementById("btnOverlayClose");
        if (overlayCloseBtn) overlayCloseBtn.style.display = "none";
        const dockChip = document.getElementById("chipDockPos");
        if (dockChip) dockChip.style.display = "none";
        const dockBtn = document.getElementById("btnDockToggle");
        if (dockBtn) dockBtn.style.display = "none";
        const chipMin = document.getElementById("chipMinimize");
        if (chipMin) chipMin.style.display = "none";
        const btnMin = document.getElementById("btnMinimizeCapsule");
        if (btnMin) btnMin.style.display = "none";
      }
    };

    // Input focus hooks for overlay service
    const inputField = document.getElementById("cmdInput");
    if (inputField) {
      inputField.addEventListener("focus", function() {
        if (hasAndroidBridge && window.AndroidUltron.requestInputFocus) {
          window.AndroidUltron.requestInputFocus(true);
        }
      });
      inputField.addEventListener("blur", function() {
        if (hasAndroidBridge && window.AndroidUltron.requestInputFocus) {
          window.AndroidUltron.requestInputFocus(false);
        }
      });
    }

    // Android Callbacks (Invoked by Android Java Native Layer)
    window.onSpeechResult = function(transcript) {
      processCommand(transcript);
    };

    window.onAssistantReply = function(query, reply) {
      showCard(query, reply);
      if (document.body.classList.contains("overlay-mode")) {
        setTimeout(() => {
          if (currentState === "ready") {
            minimizeToBubble();
          }
        }, 3500);
      }
    };

    window.onStatusUpdate = function(state, message) {
      setState(state, message);
    };
  </script>
</body>
</html>
