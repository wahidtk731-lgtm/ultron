name: Build Ultron Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Environment
        run: |
          echo "Setting up Android SDK environment..."
          ANDROID_HOME="/usr/local/lib/android/sdk"
          if [ ! -d "$ANDROID_HOME" ]; then
            ANDROID_HOME="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          
          # Accept licenses
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Ensure platform 33 and build-tools 33.0.2 are available
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2"
          
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/33.0.2"
          if [ ! -d "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
          fi
          echo "Build tools directory: $BUILD_TOOLS"
          echo "$BUILD_TOOLS" >> $GITHUB_PATH

      - name: Compile and Package Ultron APK
        run: |
          set -e
          mkdir -p bin obj gen
          
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/33.0.2"
          if [ ! -d "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
          fi
          export PATH="${BUILD_TOOLS}:${PATH}"
          
          ANDROID_JAR="${ANDROID_HOME}/platforms/android-33/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            ANDROID_JAR=$(ls -v ${ANDROID_HOME}/platforms/*/android.jar | tail -n 1)
          fi
          echo "Using Android Jar: $ANDROID_JAR"
          
          # 0. Fetch Voice Assets (Vosk + JNA + Model) and build SAM synthesizer
          echo "Step 0: Fetching Voice Assets & Building SAM Synth..."
          bash scripts/fetch_voice_assets.sh
          bash scripts/build_sam_libs.sh

          # 1. Generate R.java
          echo "Step 1: Generating R.java..."
          aapt package -f -m \
            -J gen \
            -M android/app/src/main/AndroidManifest.xml \
            -S android/app/src/main/res \
            -I "$ANDROID_JAR"

          # 2. Compile Java classes (Target Java 11 for Android D8 compatibility)
          echo "Step 2: Compiling Java classes..."
          EXTRA_CP="vendor/vosk/classes.jar:vendor/jna/classes.jar"
          javac -source 11 -target 11 -d obj -cp "$ANDROID_JAR:gen:$EXTRA_CP" \
            $(find android/app/src/main/java gen -name "*.java")

          # 3. Create DEX bytecode
          echo "Step 3: Creating DEX bytecode..."
          d8 --lib "$ANDROID_JAR" --output bin/ $(find obj -name "*.class") vendor/vosk/classes.jar vendor/jna/classes.jar

          # 4. Package resources and assets (including bundled Vosk model)
          echo "Step 4: Staging assets and packaging APK..."
          rm -rf build/assets-stage
          mkdir -p build/assets-stage/vosk-model
          cp -r android/app/src/main/assets/* build/assets-stage/
          cp -r vendor/model/vosk-model-small-en-us-0.15/* build/assets-stage/vosk-model/
          echo "vosk-model-small-en-us-0.15" > build/assets-stage/vosk-model/ULTRON_MODEL_VERSION

          aapt package -f \
            -M android/app/src/main/AndroidManifest.xml \
            -S android/app/src/main/res \
            -A build/assets-stage \
            -I "$ANDROID_JAR" \
            -F bin/UltronAssistant-unaligned.apk

          # 5. Add classes.dex into root of APK
          echo "Step 5: Adding classes.dex and native libraries to APK..."
          (cd bin && aapt add UltronAssistant-unaligned.apk classes.dex)

          rm -rf build/native-stage
          mkdir -p build/native-stage/lib/arm64-v8a build/native-stage/lib/armeabi-v7a
          cp vendor/native/arm64-v8a/*.so build/native-stage/lib/arm64-v8a/
          cp vendor/native/armeabi-v7a/*.so build/native-stage/lib/armeabi-v7a/
          (cd build/native-stage && aapt add ../../bin/UltronAssistant-unaligned.apk \
            lib/arm64-v8a/libvosk.so lib/arm64-v8a/libjnidispatch.so lib/arm64-v8a/libultronsam.so \
            lib/armeabi-v7a/libvosk.so lib/armeabi-v7a/libjnidispatch.so lib/armeabi-v7a/libultronsam.so)

          # 6. Align APK
          echo "Step 6: Running zipalign..."
          zipalign -f -p 4 bin/UltronAssistant-unaligned.apk bin/UltronAssistant-unsigned.apk

          # 7. Self-sign debug key
          echo "Step 7: Signing APK with debug keystore..."
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ultron,O=UltronAssistant,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android --out bin/UltronAssistant.apk bin/UltronAssistant-unsigned.apk
          
          # 8. Verify APK
          echo "Step 8: Verifying APK signature..."
          apksigner verify bin/UltronAssistant.apk
          
          echo "=================================================="
          echo "UltronAssistant.apk successfully compiled & signed!"
          ls -lh bin/UltronAssistant.apk
          echo "=================================================="

      - name: Upload Ultron APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltronAssistant-APK
          path: bin/UltronAssistant.apk
          if-no-files-found: error
